[package]
name = "device-keys"
version = "0.1.0"
edition = "2021"
description = "Build-time tool: computes the device's VPN and SSH keys from its secret"

# Runs on the build host only (post-build.sh); nothing of it goes into the image.
[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
