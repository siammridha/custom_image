# This root's kernel and command line: /boot/grub.cfg in the root, read by
# partition 1's grub.cfg, which sets $bootdisk, $p (this root's partition)
# and $rootuuid. It is part of the root, so it changes with updates.
#
# panic=10: reboot 10 s after a kernel panic. oops/softlockup turn kernel
# errors and CPU hangs into a panic, so they also end in a reboot.
linux ($bootdisk,$p)/boot/bzImage root=PARTUUID=$rootuuid rootfstype=squashfs ro rootwait init=/sbin/preinit console=tty0 console=ttyS0,115200 quiet panic=10 oops=panic softlockup_panic=1
