# Partition layout (GPT). GRUB's BIOS core image sits in the gap between
# the GPT entries and partition 1 (see post-image.sh).
#   p1  boot: GRUB and grubenv (which root to boot). Updates don't touch it.
#   p2  root a  } read-only squashfs with its own kernel (/boot/bzImage).
#   p3  root b  } One runs; an update writes the other (wyse-init/src/update.rs).
#   p4  /data   grown to the rest of the disk on the first boot.
image efi-part.vfat {
	vfat {
		label = "WYSEBOOT"
		file EFI { image = "efi-part/EFI" }
		file boot { image = "efi-part/boot" }
		file grubenv { image = "efi-part/grubenv" }
	}
	size = 8M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub-bios {
		in-partition-table = "no"
		image = "grub.img"
		offset = 17K
	}

	partition boot {
		partition-type-uuid = U
		bootable = true
		offset = 1M
		image = "efi-part.vfat"
	}

	partition root-a {
		partition-type-uuid = L
		image = "rootfs.squashfs"
		size = 160M
	}

	partition root-b {
		partition-type-uuid = L
		size = 160M
	}

	partition data {
		partition-type-uuid = L
		size = 32M
	}
}
