# Partition layout (GPT). GRUB's BIOS core image sits in the gap between
# the GPT entries and partition 1 (see post-image.sh).
image efi-part.vfat {
	vfat {
		label = "WYSEBOOT"
		file EFI { image = "efi-part/EFI" }
		file boot { image = "efi-part/boot" }
		file bzImage { image = "bzImage" }
	}
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub-bios {
		in-partition-table = "no"
		image = "grub.img"
		offset = 17K
	}

	partition boot {
		partition-type-uuid = U
		bootable = true
		offset = 1M
		image = "efi-part.vfat"
	}

	partition root {
		partition-type-uuid = L
		image = "rootfs.squashfs"
		size = 512M
	}

	partition data {
		partition-type-uuid = L
		size = 32M
	}
}
