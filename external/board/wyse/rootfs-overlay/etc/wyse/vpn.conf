# Tailscale and NetBird settings. LOCKED: always read from the read-only
# image (/rom/etc/wyse/vpn.conf) after every other config file, so
# /persist/wyse.conf or edits in /etc cannot change them. The boot scripts
# apply them again on every boot. To change them, build a new image
# (values come from the repo's .env at build time).

# Tailscale
TAILSCALE=yes
TS_AUTHKEY=""
TS_LOGIN_SERVER=""
# Tailscale SSH on. No exit node.
TS_UP_ARGS="--ssh"

# NetBird
NETBIRD=yes
NB_SETUP_KEY=""
NB_MANAGEMENT_URL=""
# NetBird SSH on (root login). Exit node is set in the NetBird
# dashboard: Network Routes, 0.0.0.0/0, this peer as routing peer.
# --disable-dns: NetBird leaves /etc/resolv.conf alone (DNS from DHCP or
# static settings), so name lookups work even when NetBird is down.
# --disable-auto-connect: the daemon waits for vpn-guard, which connects with
# these settings, so they are applied on every boot.
NB_UP_ARGS="--allow-server-ssh --enable-ssh-root --disable-dns --disable-auto-connect"
