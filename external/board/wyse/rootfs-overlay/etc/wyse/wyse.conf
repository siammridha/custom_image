# Built-in setup config (read-only, part of the image).
# These are the defaults. To change a value on a device, put the same
# variable in /persist/wyse.conf. That file is read after this one and is
# never wiped.

HOSTNAME=localhost

# Network mode: "dhcp" (default) or "static".
NET_MODE=dhcp

# Network interfaces. "auto" = every eth*/en* interface.
# In static mode only the first one is used.
NET_IFACES=auto

# Static mode only. NET_ADDR includes the prefix, e.g. 192.168.1.50/24.
# NET_DNS is space separated.
NET_ADDR=""
NET_GW=""
NET_DNS=""

# NTP servers (space separated). Empty = no time sync.
NTP_SERVERS="pool.ntp.org"

# SSH server (dropbear). Login is root with a key only.
# Keys: /root/.ssh/authorized_keys (built into the image).
SSH=yes

# Tailscale and NetBird settings are locked: see /etc/wyse/vpn.conf.
