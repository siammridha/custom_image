# Boot config on partition 1. It only picks which root to boot; each root
# has its own kernel and command line (/boot/bzImage, /boot/grub.cfg, from
# root-grub.cfg).
#
# grubenv (on this partition) holds:
#   slot=a|b   the root that works
#   try=a|b    set by an update: boot that root once. It is cleared here
#              before booting, so if anything goes wrong (panic, freeze,
#              power cut, no VPN: wyse-init reboots) the next boot is back
#              on `slot`. wyse-init sets slot once the new root has a VPN
#              (wyse-init/src/update.rs).
# If a root can't be booted (no kernel), GRUB boots the other one.
set timeout=1

regexp --set=1:bootdisk '^([^,]+),' "$root"
load_env -f ($bootdisk,gpt1)/grubenv slot try

if [ "$slot" = "b" ]; then good=b; other=a; else good=a; other=b; fi
if [ "$try" = "a" -o "$try" = "b" ]; then
	boot=$try
	set try=
	save_env -f ($bootdisk,gpt1)/grubenv try
else
	boot=$good
fi
if [ "$boot" = "a" ]; then set default=0; set fallback=1; else set default=1; set fallback=0; fi

menuentry "wyse a" {
	set p=gpt2
	probe --set=rootuuid --part-uuid ($bootdisk,$p)
	source ($bootdisk,$p)/boot/grub.cfg
}

menuentry "wyse b" {
	set p=gpt3
	probe --set=rootuuid --part-uuid ($bootdisk,$p)
	source ($bootdisk,$p)/boot/grub.cfg
}
