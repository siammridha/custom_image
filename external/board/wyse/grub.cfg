set default=0
set timeout=1

# Boot from partition 2 of the same disk GRUB was loaded from.
regexp --set=1:bootdisk '^([^,]+),' "$root"
probe --set=rootuuid --part-uuid ($bootdisk,gpt2)

# panic=10: reboot 10 s after a kernel panic. oops/softlockup turn kernel
# errors and CPU hangs into a panic, so they also end in a reboot.
set args="rootfstype=squashfs ro rootwait init=/sbin/preinit console=tty0 console=ttyS0,115200 quiet panic=10 oops=panic softlockup_panic=1"

menuentry "wyse" {
	linux /bzImage root=PARTUUID=$rootuuid $args
}
